<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>Super Mario: Petualangan Aturan di Rumah</title>
<style>
:root{--bg:#dff0ff;--ink:#1d2340;--card:#fff;--btn:#ffcc33;--btnink:#3a2a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#12162b;--ink:#f1f3ff;--card:#262c4d}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif}
#app{max-width:900px;margin:0 auto;padding:8px}
#hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;padding:4px 2px;flex-wrap:wrap}
#stage{position:relative}
canvas{width:100%;aspect-ratio:2/1;display:block;border-radius:12px;border:3px solid var(--ink);background:#5c94fc;touch-action:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border-radius:12px;overflow:auto}
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:14px 18px;max-width:92%;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card h2,.card h3{margin:4px 0 8px}.card p{margin:6px 0}
.b{display:block;width:100%;margin:6px 0;padding:10px 14px;font:700 16px "Trebuchet MS",sans-serif;background:var(--btn);color:var(--btnink);border:0;border-radius:12px;box-shadow:0 4px 0 #b88a00;cursor:pointer}
.b:disabled{opacity:.45;box-shadow:none}
.b.go{background:#e52521;color:#fff;box-shadow:0 4px 0 #8c1210}
#fb{min-height:20px;font-weight:700}
#ctl{display:flex;gap:10px;margin-top:8px}
#ctl button{flex:1;padding:16px 0;font:800 20px "Trebuchet MS",sans-serif;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);box-shadow:0 5px 0 #b88a00;touch-action:none;user-select:none;-webkit-user-select:none}

#ctl #bj{flex:2;background:#e52521;color:#fff;box-shadow:0 5px 0 #8c1210}
#hint{font-size:13px;text-align:center;margin:8px 0}
</style></head><body>
<div id="app">

const R=[["Rumah Ceria","#8fd3ff","#4fae5a","Mario memulai petualangan di lingkungan rumah. Kenali aturan!"],
["Pagi yang Hebat","#ffd9a0","#6fb84f","Pagi hari di halaman rumah. Kumpulkan koin!"],
["Pulang Sekolah","#9ad0f5","#4fa57a","Melewati jalan, taman, dan halaman rumah."],
["Waktu Belajar","#b6a4f0","#4aa56e","Lompati platform menuju rumah untuk belajar."],

const seq=(a,s=100)=>a.forEach((f,i)=>setTimeout(()=>snd(f,.15),i*s)),sCoin=()=>seq([988,1319],70),sJump=()=>snd(300,.15,'square',.04,600),sOk=()=>seq([523,659,784,1047],110),sBad=()=>snd(220,.25,'sawtooth',.04,150),sOpen=()=>seq([392,523,659,784],90);

function build(n){const r=rnd(n*97+13),W=1400+(n%5)*80,L={W,S:[],C:[],E:[],fx:W-200};
L.S.push({x:0,y:GY,w:W,h:60,t:'g'});
const bx=Math.floor(W*.5/32)*32;
for(let x=400;x<W-400;x+=320+r()*150){if(Math.abs(x-bx)<200)continue;const h=36+Math.floor(r()*3)*6;L.S.push({x,y:GY-h,w:50,h,t:'p'});L.C.push(...arc(x+25,GY-h-60,3))}

L.S.push({x:bx-64,y:225,w:64,h:22,t:'b'},L.blk,{x:bx+32,y:225,w:64,h:22,t:'b'});
L.C.push(...arc(bx+16,170,5));
for(let i=0;i<2+n%3;i++){const x=Math.floor((200+r()*(W-600))/32)*32;if(Math.abs(x-bx)<200||L.S.some(s=>s.t=='p'&&Math.abs(s.x-x)<150))continue;L.S.push({x,y:225,w:96,h:22,t:'b'});L.C.push(...arc(x+48,185,3))}

const ne=1+n%3+Math.floor(n/8);
for(let i=0;i<ne;i++){const x=350+r()*(W-800);L.E.push({x,x0:x,y:GY-26,w:28,h:26,d:r()<.5?-1:1,s:.7+.08*Math.floor(n/5),dead:0})}

let lv=0,mode='title',L,P,cam=0,t=0,coins=0,stars=0,first=0,tries=0,ans=0,banner=0,toast='',toastT=0,conf=[];
function load(n){lv=n;L=build(n);P={x:60,y:GY-34,w:26,h:34,vx:0,vy:0,on:1,f:1,inv:0};cam=0;ans=0;tries=0;banner=170;hud()}
function hud(){const r=Math.floor(lv/5);$('h1').textContent='Level '+(lv%5+1);$('h2').textContent='🪙 '+coins+'   ⭐ '+stars+'/25'}
const ov=h=>{const o=$('ov');if(h){o.innerHTML=h;o.style.display='flex'}else{o.style.display='none';o.innerHTML=''}};
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function coll(p,ax){for(const s of L.S){if(!hit(p,s))continue;if(ax){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w}else{if(p.vy>0){p.y=s.y-p.h;p.on=1}else if(p.vy<0){p.y=s.y+s.h;s.bump=8;if(s.t=='q'&&!s.used){p.vy=0;ask();return}}p.vy=0}}}
function step(){const p=P,ax=K.l*-1+K.r;p.vx=ax*3.2;if(ax)p.f=ax;
if(K.j&&p.on){p.vy=-13;p.on=0;sJump()}
p.vy=Math.min(p.vy+.62,14);p.x+=p.vx;coll(p,1);p.x=Math.max(0,Math.min(L.W-p.w,p.x));p.y+=p.vy;p.on=0;coll(p,0);

cam=Math.max(0,Math.min(L.W-VW,p.x-300))}
function ask(){mode='ask';P.vy=0;K.l=K.r=K.j=0;L.blk.used=1;snd(660,.1);const q=Q[lv];
ov('<div class="card"><h3>⭐ Soal Level '+(lv%5+1)+'</h3><p style="font-size:17px;font-weight:700">'+q[0]+'</p>'+q[1].map((x,i)=>'<button class="b" data-i="'+i+'">'+'ABC'[i]+'. '+x+'</button>').join('')+'<div id="fb"></div></div>')}
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.i!=null){const q=Q[lv],i=+b.dataset.i;
if(i==q[2]){sOk();stars++;if(!tries)first++;ans=1;sOpen();hud();ov('<div class="card"><h2>🎉 Hebat, jawabanmu benar!</h2><p>⭐ Kamu mendapat bintang!</p><p><b>'+q[1][q[2]]+'</b></p><p>Jalan ke bendera sudah terbuka!</p><button class="b go" data-a="play">Lanjutkan Perjalanan</button></div>')}
else{sBad();tries++;b.disabled=true;$('fb').textContent='Hampir! Jawaban itu belum tepat. Coba pikirkan lagi, kamu pasti bisa! 💪'}}
else if(b.dataset.a=='play'){ov();mode='play'}
else if(b.dataset.a=='start'||b.dataset.a=='next'){if(b.dataset.a=='start'){coins=stars=first=0;load(0)}else if(lv==24)win();else load(lv+1);ov();mode='play'}
else if(b.dataset.a=='again'){conf=[];coins=stars=first=0;mode='title';load(0);title()}});
function done(){mode='ask';K.l=K.r=K.j=0;sOpen();const r=Math.floor(lv/5),end=lv%5==4;

ov('<div class="card"><h2>🚩 Level '+(lv%5+1)+' selesai!</h2><p>⭐ '+stars+'/25 &nbsp; 🪙 '+coins+'</p>'+(end?'<p><b>Wilayah '+R[r][0]+' tamat! 🎊</b></p><p>Wilayah berikutnya: <b>'+R[r+1][0]+'</b></p>':'')+'<button class="b go" data-a="next">'+(end?'Masuk Wilayah Baru':'Level Berikutnya')+'</button></div>')}
function win(){mode='win';const n=Math.round(first/25*100);conf=[];for(let i=0;i<140;i++)conf.push({x:Math.random()*VW,y:-Math.random()*VH,vy:1+Math.random()*3,c:'hsl('+Math.random()*360+',90%,60%)'});seq([523,659,784,1047,784,1047,1319],130);

function title(){ov('<div class="card"><h2>Super Mario</h2><h3>Petualangan Aturan di Rumah</h3><p>Pendidikan Pancasila · Kelas II SD</p><p>Lari, lompat, kumpulkan koin, dan pukul balok ? untuk menjawab soal!</p><button class="b go" data-a="start">MULAI PETUALANGAN</button></div>')}
function cloud(x,y){g.beginPath();g.arc(x,y,16,0,7);g.arc(x+20,y-8,20,0,7);g.arc(x+42,y,16,0,7);g.fill()}

function draw(){const r=Math.floor(lv/5),c=R[r];g.fillStyle=c[1];g.fillRect(0,0,VW,VH);

g.fillStyle=c[2];g.globalAlpha=.55;for(let i=0;i<6;i++){g.beginPath();g.ellipse(((i*420-cam*.4)%2520+2520)%2520-250,GY,150,70+(i%3)*25,0,Math.PI,2*Math.PI);g.fill()}g.globalAlpha=1;

else if(s.t=='p'){g.fillStyle='#2ea043';g.fillRect(x+4,y,s.w-8,s.h);g.fillStyle='#3fc257';g.fillRect(x,y,s.w,14);g.strokeStyle='#145a24';g.lineWidth=2;g.strokeRect(x,y,s.w,14)}

for(const e of L.E){const x=e.x-cam;if(e.dead){g.fillStyle='#8a5a2a';g.fillRect(x,e.y+20,28,6);continue}g.fillStyle='#8a5a2a';g.beginPath();g.arc(x+14,e.y+14,14,Math.PI,0);g.fill();g.fillRect(x,e.y+14,28,6);g.fillStyle='#3a2a1a';g.fillRect(x+3+(Math.floor(t/10)%2)*4,e.y+20,8,6);g.fillRect(x+17-(Math.floor(t/10)%2)*4,e.y+20,8,6);g.fillStyle='#fff';g.fillRect(x+7,e.y+8,5,5);g.fillRect(x+16,e.y+8,5,5)}
const p=P;if(!(p.inv>0&&t%6<3)){g.save();g.translate(p.x-cam+13,p.y);g.scale(p.f,1);const lg=p.on?Math.sin(p.x/6)*4:5;
g.fillStyle='#1c4fd6';g.fillRect(-9,24+lg*.3,8,10-lg*.3);g.fillRect(1,24-lg*.3,8,10+lg*.3);g.fillRect(-10,14,20,12);

g.fillStyle='#e52521';g.fillRect(-10,-2,20,7);g.fillRect(2,3,12,3);g.fillStyle='#222';g.fillRect(3,6,3,4);g.fillStyle='#5a3414';g.fillRect(0,11,10,3);g.restore()}
if(mode=='play'&&banner>0){banner--;g.globalAlpha=Math.min(1,banner/40);g.textAlign='center';g.fillStyle='#000';g.font='bold 36px sans-serif';g.fillText('Level '+(lv%5+1),402,102);g.fillStyle='#fff';g.fillText('Level '+(lv%5+1),400,100);g.globalAlpha=1}
